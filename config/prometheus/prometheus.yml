global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: ai-local-stack

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: langgraph
    metrics_path: /metrics
    static_configs:
      - targets: ["langgraph:8080"]

  - job_name: vllm-qwen3-coder-gpu0
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-qwen3-coder-gpu0:8000"]

  - job_name: vllm-qwen-coder-fast-gpu1
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-qwen-coder-fast-gpu1:8001"]

  - job_name: vllm-qwen3-embedding-gpu1
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-qwen3-embedding-gpu1:8002"]

  - job_name: vllm-qwen3-general-gpu1
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-qwen3-general-gpu1:8003"]

  - job_name: foundry-local
    metrics_path: /metrics
    static_configs:
      - targets: ["foundry-local:8100"]

  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: langfuse-exporter
    static_configs:
      - targets: ["langfuse-exporter:9420"]

  - job_name: mcp-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-gateway:9000"]

  - job_name: policy-eval
    metrics_path: /metrics
    static_configs:
      - targets: ["policy-eval:8090"]
