    gpu: "1"
    purpose: "Default local Copilot-style assistant"

router_settings:
  routing_strategy: least-busy
  redis_host: redis
  redis_port: 6379
  num_retries: 2
  timeout: 600
  cooldown_time: 30

# Optional if you add duplicate deployments later.
# LiteLLM load balances across deployments with the same model_name.
  allowed_fails: 3

litellm_settings:
  drop_params: true
  set_verbose: false
  require_auth_for_metrics_endpoint: false
  # If you use Langfuse in your current observability stack.
  success_callback:
    - langfuse
    - prometheus
  failure_callback:
    - langfuse
  service_callback:
    - prometheus
  # Useful with OpenAI-compatible vLLM endpoints.
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

