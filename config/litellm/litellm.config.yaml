# config/litellm.config.yaml

model_list:
# ---------------------------------------------------------------------------
# GPU 0: heavy coding / SpecKit / Azure IaC
# ---------------------------------------------------------------------------

- model_name: speckit.discover
  litellm_params:
    model: hosted_vllm/qwen3-coder-30b
    api_base: http://vllm-qwen3-coder-gpu0:8000/v1
    api_key: os.environ/VLLM_API_KEY
    request_timeout: 300
    temperature: 0.2
    max_tokens: 4096
  model_info:
    mode: chat
    input_cost_per_token: 0
    output_cost_per_token: 0
    gpu: "0"
    purpose: "SpecKit discovery, repo scan, architecture intake"

- model_name: speckit.specify
  litellm_params:
    model: hosted_vllm/qwen3-coder-30b
    api_base: http://vllm-qwen3-coder-gpu0:8000/v1
    api_key: os.environ/VLLM_API_KEY
    request_timeout: 300
    temperature: 0.15
    max_tokens: 8192
  model_info:
    mode: chat
    gpu: "0"
    purpose: "SpecKit requirements and specification authoring"

- model_name: speckit.plan
  litellm_params:
    model: hosted_vllm/qwen3-coder-30b
    api_base: http://vllm-qwen3-coder-gpu0:8000/v1
    api_key: os.environ/VLLM_API_KEY
    request_timeout: 300
    temperature: 0.2
    max_tokens: 8192
  model_info:
    mode: chat
    gpu: "0"
    purpose: "Architecture and implementation planning"

- model_name: speckit.tasks
  litellm_params:
    model: hosted_vllm/qwen3-coder-30b
    api_base: http://vllm-qwen3-coder-gpu0:8000/v1
    api_key: os.environ/VLLM_API_KEY
    request_timeout: 300
    temperature: 0.15
    max_tokens: 8192
  model_info:
    mode: chat
    gpu: "0"
    purpose: "Task breakdown and work item generation"

- model_name: speckit.implement
  litellm_params:
    model: hosted_vllm/qwen3-coder-30b
